# Install once: `uvx pre-commit install`
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: forbidden-files
        name: block secrets, local state and downloaded course materials
        entry: python scripts/check_forbidden_files.py
        language: python
        pass_filenames: true
